[package]
name = "navgrid-mesh"
description = "Mesh state: single-writer records, sync between neighbours, routing toward sinks and targets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
navgrid-proto.workspace = true
serde.workspace = true
postcard.workspace = true
heapless.workspace = true
defmt = { workspace = true, optional = true }

[features]
# Growable tables (`Heap`) for the host.
alloc = []
defmt = ["dep:defmt", "navgrid-proto/defmt", "heapless/defmt"]
