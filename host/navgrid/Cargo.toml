[package]
name = "navgrid"
description = "Host tools: simulation, frame decoding; later ingest, replay, central solver"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
navgrid-proto.workspace = true
navgrid-mesh = { workspace = true, features = ["alloc"] }
navgrid-link.workspace = true
postcard.workspace = true
navgrid-ranging.workspace = true
navgrid-solver.workspace = true
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
serialport.workspace = true
qrcode.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
# Decoding devices' log frames and crash addresses with the builds they run (builds.rs).
defmt-decoder = "1.2"
object = { version = "0.36", default-features = false, features = ["read"] }
rustc-demangle = "0.1"
