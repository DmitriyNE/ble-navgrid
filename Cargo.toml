[workspace]
resolver = "3"
members = ["crates/*", "host/*"]
# Embedded target + pinned git deps; built separately (see README.md).
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
navgrid-proto = { path = "crates/navgrid-proto" }
navgrid-ranging = { path = "crates/navgrid-ranging" }
navgrid-solver = { path = "crates/navgrid-solver" }
navgrid-mesh = { path = "crates/navgrid-mesh" }

serde = { version = "1.0.228", default-features = false, features = ["derive"] }
postcard = { version = "1.1", default-features = false }
libm = "0.2.16"
heapless = { version = "0.9.3", features = ["serde"] }
defmt = "1"

anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
serialport = "4"
