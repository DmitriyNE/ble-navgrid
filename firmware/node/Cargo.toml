[package]
name = "navgrid-node"
description = "navgrid firmware: one image for mesh nodes and targets (role from config)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
navgrid-proto = { path = "../../crates/navgrid-proto", features = ["defmt"] }
navgrid-ranging = { path = "../../crates/navgrid-ranging", features = ["defmt"] }
navgrid-solver = { path = "../../crates/navgrid-solver", features = ["defmt"] }

embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5", default-features = false, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", default-features = false, features = ["nrf54l15-app-s", "time-driver-grtc", "gpiote", "unstable-pac", "rt", "defmt"] }
embassy-futures = "0.1.1"
nrf-sdc = { version = "0.4", default-features = false, features = ["nrf54l15-app-s", "central", "peripheral", "defmt"] }
nrf-mpsl = { version = "0.4", default-features = false, features = ["critical-section-impl", "defmt"] }
bt-hci = { version = "0.11", default-features = false, features = ["defmt"] }
trouble-host = { git = "https://github.com/GreatKet/trouble.git", rev = "fa9886d3f92d0b9a8adf7323a9b10b991a131d2c", features = ["defmt", "channel-sounding", "security", "scan"] }

defmt = "1"
critical-section = "1"
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
static_cell = "2"
heapless = "0.9.3"

# Pairing (CS needs an encrypted link): TrouBLE's security manager takes its crypto from
# embassy-crypto drivers, at the revision TrouBLE itself uses.
embassy-sync = "0.8"
embassy-crypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c" }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c", features = ["embassy-crypto-aes128-ecb", "embassy-crypto-aes128-cmac", "embassy-crypto-p256-ecdh"] }
rand_chacha = { version = "0.9", default-features = false }
# Under the bootloader (firmware.rs, ../bootloader).
embassy-boot = { version = "0.7", features = ["defmt", "ed25519-dalek"] }
embassy-boot-nrf = { version = "0.12", features = ["defmt"] }
embassy-embedded-hal = "0.6"
# The sink checks an update from the host before passing it on (update.rs).
ed25519-dalek = { version = "2", default-features = false, features = ["digest"] }
# Fleet-key link keys (keys.rs) and RRAM storage (store.rs).
aes = "0.9.3"
cmac = "0.8.0"
embedded-storage = "0.3.2"

[features]
# Exactly one board. `cargo tag` / `cargo dk` (see .cargo/config.toml) pick it for you.
board-dk = []
board-tag = []
# Test aid: the image never confirms itself, so the bootloader puts the previous one back after
# 5 min (architecture §13).
never-confirm = []
# Test aid: crashes 20 s after boot, a panic or a hard fault in turn, for the crash reports.
crash-test = []
