[package]
name = "navgrid-node"
description = "navgrid firmware: one image for mesh nodes and targets (role from config)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
navgrid-proto = { path = "../../crates/navgrid-proto", features = ["defmt"] }
navgrid-ranging = { path = "../../crates/navgrid-ranging", features = ["defmt"] }
navgrid-solver = { path = "../../crates/navgrid-solver", features = ["defmt"] }

embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5", default-features = false, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", default-features = false, features = ["nrf54l15-app-s", "time-driver-grtc", "gpiote", "unstable-pac", "rt", "defmt"] }
embassy-futures = "0.1.1"
nrf-sdc = { version = "0.4", default-features = false, features = ["nrf54l15-app-s", "central", "peripheral", "defmt"] }
nrf-mpsl = { version = "0.4", default-features = false, features = ["critical-section-impl", "defmt"] }
bt-hci = { version = "0.11", default-features = false, features = ["defmt"] }
trouble-host = { git = "https://github.com/GreatKet/trouble.git", rev = "fa9886d3f92d0b9a8adf7323a9b10b991a131d2c", features = ["defmt", "channel-sounding"] }

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
static_cell = "2"

[features]
# Exactly one board. `cargo tag` / `cargo dk` (see .cargo/config.toml) pick it for you.
board-dk = []
board-tag = []
