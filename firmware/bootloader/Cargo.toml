[package]
name = "navgrid-bootloader"
description = "navgrid bootloader: embassy-boot with an active and an update slot in RRAM"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

# Its own workspace: it brings cortex-m's critical section, the node nrf-mpsl's.
[workspace]

[dependencies]
embassy-nrf = { version = "0.11", default-features = false, features = ["nrf54l15-app-s"] }
embassy-boot-nrf = "0.12"
embassy-sync = "0.8"
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = { version = "1", optional = true }
defmt-rtt = { version = "1", optional = true }

[features]
# RTT logs from the bootloader, for debugging it; off, it stays small.
defmt = ["dep:defmt", "dep:defmt-rtt", "embassy-boot-nrf/defmt", "embassy-nrf/defmt"]

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = "s"

# The same Embassy as the node (../Cargo.toml).
[patch.crates-io]
embassy-nrf = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-boot = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-boot-nrf = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
