[workspace]
resolver = "3"
members = ["node"]
# Its own workspace (see its Cargo.toml).
exclude = ["bootloader"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[profile.dev]
opt-level = 3
debug = 2

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
# Size: at `3` the image was 673 KiB of the 720 KiB slot (spike 2026-11-04-firmware-ram-budget).
opt-level = "s"

# D-8: Channel Sounding needs bt-hci 0.11 plus our CS patches (architecture §6), so bt-hci and
# nrf-sdc come from our forks and trouble-host from GreatKet (node/Cargo.toml). Embassy stays at the
# revision TrouBLE's examples/nrf54 builds against. bt-hci-transport must come from the same
# checkout as bt-hci, or the build sees two copies of its traits.
[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-nrf = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-boot = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-boot-nrf = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
nrf-sdc = { git = "https://github.com/DmitriyNE/nrf-sdc.git", rev = "638125782879d7c4664f47a583560fc6b53e53e1" }
nrf-mpsl = { git = "https://github.com/DmitriyNE/nrf-sdc.git", rev = "638125782879d7c4664f47a583560fc6b53e53e1" }
bt-hci = { git = "https://github.com/DmitriyNE/bt-hci.git", rev = "4886657c01f38fc49d6100b4e01430e2f991d55d" }
bt-hci-transport = { git = "https://github.com/DmitriyNE/bt-hci.git", rev = "4886657c01f38fc49d6100b4e01430e2f991d55d" }

# TrouBLE with our fixes on GreatKet's revision (log 2026-11-05: a security event for a link
# already gone stopped the host runner for good, DEF-71). A local clone beside this repository,
# branch `navgrid`, until the fork is published and the patch can point at it.
[patch."https://github.com/GreatKet/trouble.git"]
trouble-host = { path = "../../trouble/host" }
