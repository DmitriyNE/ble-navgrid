[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# --verify: the TAG has been seen to mis-program silently over the DK's DEBUG OUT link.
runner = "probe-rs run --chip nRF54L15 --verify"

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "info"

[alias]
tag = "run --release --features board-tag"
dk = "run --release --features board-dk"
