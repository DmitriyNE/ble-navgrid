[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Double buffering corrupts one word near the start of most pages on the TAG (DEF-16); --verify
# catches anything else.
runner = "probe-rs run --chip nRF54L15 --disable-double-buffering --verify"

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "info"

[alias]
tag = "run --release --features board-tag"
dk = "run --release --features board-dk"
