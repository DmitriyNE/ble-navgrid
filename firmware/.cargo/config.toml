[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Double buffering corrupts one word near the start of most pages on the TAG (DEF-16); --verify
# catches anything else. At probe-rs's default 400 kHz SWD clock the DK's J-Link loses a TAG within
# seconds of CS starting (DEF-19); 100 kHz holds, at the cost of a ~2 min flash.
runner = "probe-rs run --chip nRF54L15 --speed 100 --disable-double-buffering --verify"

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "info"
# 24 packets of 251 B: a sink forwards telemetry from several links at once (log 2026-11-04).
TROUBLE_HOST_DEFAULT_PACKET_POOL_SIZE = "24"

[alias]
tag = "run --release --features board-tag"
dk = "run --release --features board-dk"
